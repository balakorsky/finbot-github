name: Weekly Receipt Automation

on:
  schedule:
    # Каждую среду в 17:00 UTC = 20:00 Israel time (UTC+3)
    - cron: '0 17 * * 3'
  workflow_dispatch:  # Ручной запуск через GitHub UI → Actions → Run workflow

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Нужно для коммита state-файлов обратно в репо

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install chromium --with-deps

      - name: Write credentials from secrets
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          mkdir -p credentials downloads logs state
          printf '%s' "$CLIENT_SECRET_JSON" > credentials/client_secret.json
          printf '%s' "$TOKEN_JSON" > credentials/token.json

      - name: Validate credential files
        run: |
          echo "client_secret.json: $(wc -c < credentials/client_secret.json) bytes"
          echo "token.json: $(wc -c < credentials/token.json) bytes"
          node -e "JSON.parse(require('fs').readFileSync('credentials/client_secret.json','utf8')); console.log('client_secret OK')"
          node -e "JSON.parse(require('fs').readFileSync('credentials/token.json','utf8')); console.log('token OK')"

      - name: Fetch receipts from Gmail
        run: node fetch-receipts.js

      - name: Upload to FinBot
        run: node upload-to-finbot.js
        env:
          FINBOT_URL: https://brstrf.finbot.co.il/hs-user/
          FINBOT_USERNAME: ${{ secrets.FINBOT_USERNAME }}
          FINBOT_PASSWORD: ${{ secrets.FINBOT_PASSWORD }}
          HEADLESS: 'true'

      - name: Commit updated deduplication state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/processed-messages.json state/uploaded-files.json
          git diff --staged --quiet || git commit -m "chore: update deduplication state [skip ci]"
          git pull --rebase origin main
          git push

      - name: Upload screenshot as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finbot-screenshot-${{ github.run_id }}
          path: logs/upload-result-*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Notify Telegram — success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=✅ FinBot: квитанции успешно скачаны и загружены."

      - name: Notify Telegram — failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=❌ FinBot: ошибка! Подробности: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
